# ============================================================
# USTIL 社区网站 —— docker compose 编排
# 服务：pg（PostgreSQL 16）+ redis（7）+ api（NestJS）+ migrate（迁移）+ web（nginx 静态站）
#
# 变量注入（密钥不落盘、不入库）：
#   - 本地：cp .env.example .env 填真实值，compose 自动读取 deploy/.env 做插值
#   - CI：GitHub Actions secrets → environment 注入同名变量
#
# 迁移红线（AGENTS.md §8）：MUST NOT 写进容器启动，只由部署 job 幂等执行：
#   docker compose --profile migrate run --rm migrate
#
# 依赖：Docker Compose v2+（profiles、depends_on condition）
# ============================================================

services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ustil}
      POSTGRES_USER: ${POSTGRES_USER:-ustil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ustil} -d ${POSTGRES_DB:-ustil}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../ustil-hub
      target: runtime
    # CI（GitHub Actions release.yml）构建/推送的镜像 tag 与本处一致（$REGISTRY/$IMAGE_TAG），部署时直接复用
    image: ${REGISTRY:-ustil}/ustil-api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      # 仅信任入口 nginx 一跳；不要给 api 添加公网 ports 映射。
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATABASE_URL: postgres://${POSTGRES_USER:-ustil}:${POSTGRES_PASSWORD:-change-me}@pg:5432/${POSTGRES_DB:-ustil}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/storage
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-10485760}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      # 本地存储上传（STORAGE_DRIVER=local）
      - uploads-data:/app/storage
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 定时任务（SchedulerService）随 api 进程运行：
    #   每日 03:00 清理满 7 天的 VISITOR；03:10 将满 4 年的 MEMBER 升为 ALUMNI
    # 本编排为单实例可直接跑；若扩为多实例需加 pg advisory lock 防并发执行

  migrate:
    build:
      context: ../ustil-hub
      target: migrate
    image: ${REGISTRY:-ustil}/ustil-api-migrate:${IMAGE_TAG:-latest}
    # 只在显式声明 profile 时参与编排，避免随 up 误跑
    profiles: ["migrate"]
    environment:
      # 与 api 同 env
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-ustil}:${POSTGRES_PASSWORD:-change-me}@pg:5432/${POSTGRES_DB:-ustil}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/storage
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-10485760}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      pg:
        condition: service_healthy

  seed:
    build:
      context: ../ustil-hub
      target: seed
    image: ${REGISTRY:-ustil}/ustil-api-seed:${IMAGE_TAG:-latest}
    # 初始 ADMIN 种子（幂等），只在显式声明 profile 时参与编排：
    #   docker compose --profile seed run --rm seed
    profiles: ["seed"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-ustil}:${POSTGRES_PASSWORD:-change-me}@pg:5432/${POSTGRES_DB:-ustil}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      pg:
        condition: service_healthy

  web:
    build:
      context: ../ustil-front
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: ${REGISTRY:-ustil}/ustil-web:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 站点配置在构建上下文之外（deploy/nginx/），挂载注入
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS 证书（deploy/init-certs.sh 生成或 CA 签发），私钥不入库
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  uploads-data:
