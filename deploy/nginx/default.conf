# USTIL 站点配置（nginx:alpine，由 docker-compose 挂载到 /etc/nginx/conf.d/default.conf）
# web 容器托管前端 dist/ 静态文件，并把 /api/ 反代到 api:3000（compose 内网 DNS）
# TLS：证书挂载自 deploy/nginx/certs/（见 deploy/init-certs.sh），HTTP 强制跳转 HTTPS

# 空键不会被计数；只对公开注册入口限制突发请求。
map $uri $registration_limit_key {
    default "";
    /api/v1/auth/register $binary_remote_addr;
}
limit_req_zone $registration_limit_key zone=registration:10m rate=5r/m;

# docs 子域 → 主域（登录页跳转用，兼容 docs.localhost 本地验证）
map $host $main_site_host {
    ~^docs\.(.+)$ $1;
    default $host;
}

server {
    listen 80;
    server_name _;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /usr/share/nginx/html;
    index index.html;

    # 文件上传 ≤10MB（服务端 UPLOAD_MAX_SIZE 校验），这里留余量
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API 反代：proxy_pass 不带 URI 部分，原样保留 /api/v1 前缀转发到 api:3000
    # （refresh_token cookie 的 Path=/api/v1/auth 与前端同源，同源可达，无需跨域）
    location /api/ {
        limit_req zone=registration burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 公网入口重建客户端地址，不接受客户端自带的代理链。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 旧文档路径默认跳转 docs 子域（v11.0）
    location = /docs { return 302 https://docs.$host/; }
    location /docs/ { return 302 https://docs.$host/; }

    # SPA history 路由：未命中静态文件一律回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
# API 文档站（v11.0）：docs 子域自托管（Scalar 静态页 + openapi.yaml）
# 门禁：auth_request 携 Cookie 探测 api:/auth/docs-probe——MEMBER+ 204 放行，
#       VISITOR 403 / 未登录 401 → 跳主站登录页并带回跳；文档与规范整站受保护
# 试调：COOKIE_DOMAIN=.openatomustil.cn + CORS 允许本子域后，浏览器携带主站会话直调 API；
#       <ALUMNI 由页面脚本隐藏试调区（服务端 RBAC 仍是最终约束）
server {
    listen 443 ssl;
    server_name docs.*;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /usr/share/nginx/docs;
    index index.html;

    # 访问探针（内部子请求；透传原请求 Cookie，不带请求体）
    location = /internal/docs-probe {
        internal;
        proxy_pass http://api:3000/api/v1/auth/docs-probe;
        proxy_http_version 1.1;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # 未登录 / 权限不足 → 主站登录页（带回跳）
    error_page 401 403 = @docs_gate;
    location @docs_gate {
        return 302 https://$main_site_host/login?redirect=https://$host$request_uri;
    }

    # 规范文件不缓存（文档更新即时生效）；必须以 YAML MIME 下发，
    # octet-stream 会导致 Scalar 拒绝解析（已实测）
    location = /openapi.yaml {
        auth_request /internal/docs-probe;
        default_type text/yaml;
        add_header Cache-Control "no-store";
    }

    location / {
        auth_request /internal/docs-probe;
        try_files $uri $uri/ =404;
    }
}
