# USTIL 站点配置（nginx:alpine，由 docker-compose 挂载到 /etc/nginx/conf.d/default.conf）
# web 容器托管前端 dist/ 静态文件，并把 /api/ 反代到 api:3000（compose 内网 DNS）
# TLS：证书挂载自 deploy/nginx/certs/（见 deploy/init-certs.sh），HTTP 强制跳转 HTTPS

server {
    listen 80;
    server_name _;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /usr/share/nginx/html;
    index index.html;

    # 文件上传 ≤10MB（服务端 UPLOAD_MAX_SIZE 校验），这里留余量
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API 反代：proxy_pass 不带 URI 部分，原样保留 /api/v1 前缀转发到 api:3000
    # （refresh_token cookie 的 Path=/api/v1/auth 与前端同源，同源可达，无需跨域）
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history 路由：未命中静态文件一律回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
