# 发布镜像：main 推送 / 手动触发，构建三镜像并推送到 GHCR
# 部署（迁移 + compose up）在目标主机执行，见 README「Docker 部署」
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 镜像前缀（GHCR，仓库名强制小写）
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建 api（runtime）
        run: |
          docker build --target runtime \
            -t "$IMAGE_PREFIX/ustil-api:$IMAGE_TAG" -t "$IMAGE_PREFIX/ustil-api:latest" ustil-hub
      - name: 构建 api-migrate（迁移镜像）
        run: |
          docker build --target migrate \
            -t "$IMAGE_PREFIX/ustil-api-migrate:$IMAGE_TAG" -t "$IMAGE_PREFIX/ustil-api-migrate:latest" ustil-hub
      - name: 构建 web
        run: |
          docker build \
            -t "$IMAGE_PREFIX/ustil-web:$IMAGE_TAG" -t "$IMAGE_PREFIX/ustil-web:latest" ustil-front

      - name: 推送镜像
        run: |
          docker push "$IMAGE_PREFIX/ustil-api:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX/ustil-api:latest"
          docker push "$IMAGE_PREFIX/ustil-api-migrate:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX/ustil-api-migrate:latest"
          docker push "$IMAGE_PREFIX/ustil-web:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX/ustil-web:latest"
